; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino, espidf
monitor_speed = 115200
monitor_filters = direct
board_build.filesytem = littlefs
build_unflags = -std=gnu++2b
build_flags = -std=gnu++2a
lib_deps = 
    adafruit/Adafruit BusIO@^1.17.2
    adafruit/Adafruit ADS1X15@^2.5.0
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.17
    # jgromes/RadioLib@^7.3.0

[env:v2-receiver]
board = heltec_wifi_lora_32_V2
board_build.partitions = partitions.csv
board_build.filesytem = littlefs
build_flags = 
    ${env.build_flags}
    -D ADS1115_SDA=GPIO_NUM_21
    -D ADS1115_SCL=GPIO_NUM_22
    -D PRG_BUTTON=GPIO_NUM_0
    -D LORA_CS=GPIO_NUM_18
    -D LORA_SCK=GPIO_NUM_5
    -D LORA_DIO0=GPIO_NUM_26
    -D LORA_MISO=GPIO_NUM_19
    -D LORA_MOSI=GPIO_NUM_27
    -D LORA_RST=GPIO_NUM_14

[env:v2-sensor]
board = heltec_wifi_lora_32_V2
board_build.partitions = partitions.csv
board_build.filesytem = littlefs
build_flags = 
    ${env.build_flags}
    -Os
    -D ADS1115_SDA=GPIO_NUM_21
    -D ADS1115_SCL=GPIO_NUM_22
    -D PRG_BUTTON=GPIO_NUM_0
    -D LORA_CS=GPIO_NUM_18
    -D LORA_SCK=GPIO_NUM_5
    -D LORA_DIO0=GPIO_NUM_26
    -D LORA_MISO=GPIO_NUM_19
    -D LORA_MOSI=GPIO_NUM_27
    -D LORA_RST=GPIO_NUM_14
    -D IS_SENSOR_NODE
    -D DISABLE_RTDB
    -D DISABLE_ERROR_QUEUE
    -D DISABLE_FCM
    -D DISABLE_FB_STORAGE
    -D DISABLE_GC_STORAGE
    -D DISABLE_PSRAM
    -D DISABLE_ERROR_STRING
    -D DISABLE_OTA
    -D DISABLE_SD
    -D DISABLE_FLASH
    -D DISABLE_DEBUG
    -D ENABLE_FB_FUNCTIONS
    -D ENABLE_FIRESTORE

